# readme.txt and the directory assets (banners, icons, screenshots) can change
# between releases — this pushes them to SVN without a version bump.
#
# Run by hand, not on push: the action refuses outright when anything beyond the
# readme and the assets has changed, and a push filter matches when a commit
# touches readme.txt *and* code, so it failed on nearly every release. Code
# reaches wordpress.org through deploy.yml and a version tag; this is only for
# the times a readme or a banner changes on its own.
name: Update WordPress.org assets and readme

on:
  workflow_dispatch:

jobs:
  assets:
    # Set the WPORG_DEPLOY repository variable to 'true' once the plugin is
    # approved and the SVN secrets exist; until then this job is skipped.
    if: vars.WPORG_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: counterhand-mcp-for-woocommerce
          ASSETS_DIR: .wordpress-org
