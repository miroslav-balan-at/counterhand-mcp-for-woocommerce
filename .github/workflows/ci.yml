name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Against whatever WooCommerce and the integrated plugins released today, so an
  # update that breaks a tool is found here rather than on someone's store.
  schedule:
    - cron: '17 4 * * *'

jobs:
  # GitHub disables a schedule after 60 days without repository activity, which
  # would end the daily run above silently on a quiet stretch.
  keep-schedule-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer run lint
      - run: composer run analyse -- --memory-limit=1G
      - run: composer run test

  # The same disposable devbox store the suite uses locally (tests/e2e/store),
  # so a green run here means what a green run on a laptop means.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install devbox and the store's packages
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          project-path: tests/e2e/store
          devbox-version: 0.17.1
          enable-cache: 'true'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the store
        run: |
          npm run e2e:store:start
          for _ in $(seq 1 60); do
            nc -z 127.0.0.1 8007 && exit 0
            sleep 2
          done
          echo 'nginx never came up on :8007' >&2
          cat "$HOME/.cache/counterhand-e2e/log/process-compose.log" >&2 || true
          exit 1

      - name: Run the suite
        run: npm run e2e

      - name: Store logs
        if: failure()
        run: |
          for log in "$HOME"/.cache/counterhand-e2e/log/*.log "$HOME"/.cache/counterhand-e2e/wordpress/wp-content/debug.log; do
            [ -f "$log" ] && { echo "::group::$log"; tail -n 200 "$log"; echo '::endgroup::'; }
          done
          true

      # Traces hold bearer tokens for this run's throwaway store only.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ~/.cache/counterhand-e2e/report
            ~/.cache/counterhand-e2e/results
          retention-days: 7

      - name: Stop the store
        if: always()
        run: npm run e2e:store:stop
